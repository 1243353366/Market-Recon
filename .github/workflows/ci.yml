name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements-api.txt -r requirements-dev.txt qdrant-client beautifulsoup4
      - name: Compile check
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = []
          for path in pathlib.Path('.').rglob('*.py'):
              if '.git' in path.parts:
                  continue
              try:
                  ast.parse(path.read_text(encoding='utf-8'))
              except SyntaxError as exc:
                  bad.append(f'{path}: {exc}')
          print('\n'.join(bad) if bad else 'all python files parse')
          sys.exit(1 if bad else 0)
          PY
      - name: Unit tests
        run: python -m pytest tests -v
      - name: Filing classification benchmark
        run: python benchmark/filing_eval.py

  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run Go tests
        working-directory: go/ingest-gateway
        run: go test -v ./...

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust tests
        working-directory: rust/signal-engine
        run: cargo test --verbose

  typescript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and test UI
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
