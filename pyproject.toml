[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-recon"
version = "0.2.0"
description = "Open-source stock intelligence platform for public market research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1.4",
  "numpy>=1.26.4",
  "requests>=2.31.0",
  "streamlit>=1.35.0",
  "yfinance>=0.2.40",
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.1",
]

[project.optional-dependencies]
rag = [
  "qdrant-client>=1.9.0",
  "sentence-transformers>=3.0.0",
  "beautifulsoup4>=4.12.3",
]

[project.scripts]
market-recon-rag = "market_recon.rag.cli:main"

[tool.setuptools.packages.find]
include = ["market_recon*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
